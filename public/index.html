<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>花果山 · AI 践行者</title>
  <meta name="description" content="花果山的个人主页：信创与政企 AI、黑客松作品、AI 创作与获奖记录。">
  <meta name="theme-color" content="#0D1233">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.cn">
  <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Unbounded:wght@500;800&family=ZCOOL+QingKe+HuangYou&display=swap">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <a class="skip" href="#works">跳到成果</a>

  <header class="hero" id="top">
    <canvas id="hero-canvas" aria-hidden="true"></canvas>
    <nav class="topbar" aria-label="页面导航">
      <a class="brand" href="#top" data-name>花果山</a>
      <ul>
        <li><a href="#featured">代表作</a></li>
        <li><a href="#works">成果年表</a></li>
        <li><a href="#review" data-review-nav>年度总结</a></li>
      </ul>
    </nav>
    <div class="hero-foot">
      <h1 class="sr-only" data-name>花果山</h1>
      <ol class="roles" id="roles" aria-label="身份"></ol>
      <p class="hero-hint">点一下画面，看它变</p>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="intro-title">
      <h2 id="intro-title" class="sr-only">关于我</h2>
      <div class="intro-text" id="intro"></div>
      <div class="intro-side">
        <p class="tally-lead" id="tally-lead"></p>
        <ul class="tally" id="tally"></ul>
        <ul class="links" id="links"></ul>
      </div>
    </section>

    <section class="featured" id="featured" aria-labelledby="featured-title">
      <h2 class="section-title" id="featured-title">代表作</h2>
      <div id="featured-list" class="featured-list"></div>
    </section>

    <section class="works" id="works" aria-labelledby="works-title">
      <div class="works-head">
        <h2 class="section-title" id="works-title">成果年表</h2>
        <div class="filters" id="filters" role="toolbar" aria-label="按类别筛选"></div>
      </div>
      <div id="timeline" class="timeline"></div>
    </section>

    <section class="review" id="review" aria-labelledby="review-title" hidden>
      <h2 class="section-title" id="review-title"></h2>
      <p class="review-intro" id="review-intro"></p>
      <ol class="review-list" id="review-list"></ol>
    </section>
  </main>

  <footer class="footer">
    <p class="footer-line" id="footer-line"></p>
    <ul class="links" id="footer-links"></ul>
    <p class="footer-meta"><span id="copyright"></span><a href="/admin" class="admin-link">管理</a></p>
  </footer>

  <dialog class="detail" id="detail" aria-labelledby="detail-title">
    <div class="detail-inner" id="detail-body"></div>
    <button class="icon-btn detail-close" data-close aria-label="关闭">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </dialog>

  <dialog class="lightbox" id="lightbox" aria-label="查看大图">
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="icon-btn lb-prev" id="lb-prev" aria-label="上一张">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn lb-next" id="lb-next" aria-label="下一张">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn lb-close" id="lb-close" aria-label="关闭大图">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <p class="lb-count" id="lb-count"></p>
  </dialog>

  <script type="module" src="/js/site.js"></script>
</body>
</html>
